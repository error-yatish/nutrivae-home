databases:
  - name: nutrivae-db
    databaseName: strapi
    user: strapi

services:
  - type: web
    name: nutrivae-backend
    env: docker
    dockerfilePath: Dockerfile.backend
    dockerContext: .
    plan: free
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DATABASE_CLIENT
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: nutrivae-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: APP_KEYS
        generateValue: true
      - key: API_TOKEN_SALT
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: TRANSFER_TOKEN_SALT
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
    disk:
      name: backend-uploads
      mountPath: /app/public/uploads
      sizeGB: 1

  - type: web
    name: nutrivae-frontend
    env: docker
    dockerfilePath: Dockerfile.frontend
    dockerContext: .
    plan: free
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: IS_DOCKER
        value: "true"
      - key: STRAPI_URL
        fromService:
          type: web
          name: nutrivae-backend
          property: host
      - key: PUBLIC_STRAPI_URL
        fromService:
          type: web
          name: nutrivae-backend
          property: url
